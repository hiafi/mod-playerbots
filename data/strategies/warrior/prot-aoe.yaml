# The reworked Protection warrior's pack rows: "warrior/prot-aoe" is appended to the "aoe" strategy for a Protection
# bot by WarriorReworkAoeStrategy::InitTriggers (an Arms or Fury bot gets the stock aoe rows instead). The single-target
# rotation is warrior/prot.yaml, whose header explains the bands, the conditions and the spell ids. Here the same casts
# run under "prot pack ..." names, since these rows fire in the same tick as those of prot.yaml and rows that share an
# action name merge into one basket that re-checks only the first row.
#
# A pack is three or more enemies within Thunder Clap's 8 yd (PW5). There is no unsafe-aoe-units gate: a tank must AoE,
# the same ruling as the Bear (DQ8). The pack rows sit at normal + 9.x, above the single-target rows, in the plan's
# order: Thunder Clap, Shockwave, Shield Slam (while Shield Discipline is down, or always without Storm's Bulwark),
# Revenge, Devastate. Cleave is the pack's rage dump, an instant GCD strike at normal + 9.1 (above the pack
# Devastate 9.0, below Revenge 9.2), spent only at 60 rage or more like Heroic Strike on one or two targets. Heroic
# Strike steps aside at three enemies (prot.yaml), so the two never compete.
strategy: warrior/prot-aoe
class: warrior
conditions:
  rage: value("rage::self target")
  pack: alive(target) and enemies_within(8) >= 3
  shield: trigger("prot shield")
  bulwark: known(200058) or known(200059) or known(200060)
  disc_up: aura(self, 200064)
rows:
  # A1: Thunder Clap on cooldown
  - do: prot pack thunder clap
    when: pack and known(6343) and cooldown(6343) == 0
    relevance: normal + 9.5
  # A2: Shockwave on cooldown (not known at level 60)
  - do: prot pack shockwave
    when: pack and known(46968) and cooldown(46968) == 0
    relevance: normal + 9.4
  # A3: Shield Slam while Shield Discipline is down, or always without Storm's Bulwark
  - do: prot pack shield slam
    when: >-
      pack and known(23922) and cooldown(23922) == 0 and shield
      and (not bulwark or not disc_up)
    relevance: normal + 9.3
  # A4: Revenge whenever it is castable
  - do: prot pack revenge
    when: pack and known(6572) and cooldown(6572) == 0 and trigger("revenge")
    relevance: normal + 9.2
  # A5: Devastate, the filler
  - do: prot pack devastate
    when: pack and known(20243) and shield
    relevance: normal + 9
  # A6: Cleave (instant GCD strike) at 60 rage or more
  - do: prot cleave
    when: pack and known(845) and rage >= 60
    relevance: normal + 9.1
