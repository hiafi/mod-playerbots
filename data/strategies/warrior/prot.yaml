# The reworked Protection warrior's single-target rotation, from the user's guide (docs/reworks/bot-strategy/
# warrior-prot-strat.md, corrected by .agents/plans/rework-bot-strategies/rework-bot-strategies.WARRIOR.PLAN.md section
# 3 and 5): "warrior/prot" is appended to the "prot" combat strategy by WarriorReworkProtStrategy::InitTriggers. The
# pack rows are the `warrior/prot-aoe` document, appended to "aoe". Each row queues its action at the relevance when its
# condition holds (`when`, the expression language of StrategyExpression.h) or when an existing C++ trigger fires
# (`trigger`). Execution order is by relevance, not by position in this file. Actions named "prot ..." are
# RowCheckedAction (they re-check their own row before casting); the others ("taunt", "commanding shout", "reach
# melee", "charge", "shield bash", "challenging shout", "berserker rage") are stock.
#
# Bands: defensives (emergency) > taunt (interrupt) > stance, shout, the off-the-GCD rows, `reach melee` (high) > the
# rotation (normal + 8.x; the pack rows of prot-aoe sit at normal + 9.x). Shield Block, Spell Reflection, Bloodrage,
# Last Stand, Shield Wall and Defensive Stance are off the GCD (StartRecoveryTime 0 in spell_dbc): the engine skips the
# GCD-blocked rows above them, so they still fire during the GCD. Heroic Strike is an instant strike on the GCD (no
# longer a next-swing flag): it sits in the rotation at normal + 8.1, above the Devastate filler (8.0) and below
# Concussion Blow (8.2), and is spent only at 60 rage or more so it never starves Shield Slam (20), Thunder Clap (20
# minus Improved Thunder Clap) or Revenge (5).
#
# Rows that queue the same action name and qualifier merge into one basket that keeps the first pusher's event, so only
# that row is re-checked. The overlaps are on purpose (a failed re-check costs one tick): Shield Slam R1/R6, Thunder
# Clap R2/R5, Devastate R7/R8. The first row of each basket (R6, R2, R8) is the one the engine re-checks, since it walks
# the triggers in file order and keeps the event of the first row that holds; R6 and R8 are the broader conditions (R1
# and R7 imply them), while R2 and R5 are mutually exclusive, so whichever holds is the one kept.
#
# Every spell a bot may not know yet carries `known()`: `cooldown()` of an unknown spell reads 0, and `known()` also
# reads talents, so the passive ones work. Spell Reflection (23920) is trained at level 44, so bots learn it;
# Enraged Regeneration (55694) is trained at level 56 (trainer 200), so bots learn it.
# Shockwave (46968) is the last talent of the tree and the 51-point premade link takes it, so bots know it at 60; its
# rows stay gated on `known()` for the levels before. Every row on the target has `alive(target)`.
# Rage is `value("rage::self target")`; "tanking" is `value("my attacker count")`, every unit whose victim is the bot.
#
# Shield Discipline (the talent, ranks 200062/200063; buff 200064) is set by a Shield Slam that hits and consumed by ANY
# Thunder Clap, which then grants the larger shield (the shield itself is the absorb aura 200028); the buff waits 20 s.
# No row reads Storm's Bulwark: R1 is gated on Shield Discipline being learned (the guide: from 50, before that the
# single target list skips to line 5). Shield Slam, Devastate, Shield Block, Spell Reflection and Shield Wall need a
# shield: `prot shield` (a class trigger) is true with one, and a bot without one falls back to Sunder Armor (R8b) and
# Thunder Clap. Revenge is castable only in the 5 s after a dodge, parry or block (an aura state, Defensive Stance), so
# its rows are "castable" and never a cadence. Sword and Board (any rage cast) makes Shield Slam free, so it needs no
# row of its own. No row reads Tempered, Empowered Revenge, 200045 or the Thunder Clap echo; there is no hold-position
# rule after a Thunder Clap (the echo strikes where the Thunder Clap was cast; a tank barely moves).
#
# Recent damage is `value("prot recent damage")`: the percent of maximum health taken in the last 5 s, absorbed damage
# included. It is sampled when read, so it comes first in every condition that uses it. A loose enemy is an enemy in
# combat with the group that is hitting a party member other than the bot (and not another tank):
# `alive("prot loose enemy")` is the nearest one, `prot loose enemies::<yd>` counts them.
#
# Sunder Armor: Devastate and the Sunder Armor ability (7386, a trigger-spell effect) both leave the debuff 58567 on the
# target, so the stacks and the time left are read from 58567, from the bot's own casts.
#
# Charge (the C1 row) is usable in combat and from Defensive Stance for every warrior. Heroic Leap (204400, off the GCD)
# is the second gap closer, used when Charge is on cooldown; Skull Banner (204405, off the GCD) opens a boss fight when
# fewer than half the group carry Rallied (204407); Victory Rush (34428) is usable in the 20 s Victorious window
# (aura 32216) after a kill. Berserker
# Rage (18499) has no stance requirement on this server (spell_dbc ShapeshiftMask 0), so the fear break casts it from
# Defensive Stance with no swap. Shield Bash (72) works in Battle and Defensive Stance but needs a shield.
#
# Spell ids: Charge 100, Shield Bash 72, Defensive Stance 71, Heroic Strike 78, Cleave 845, Shield Wall 871,
# Challenging Shout 1161, Shield Block 2565, Bloodrage 2687 (aura 29131), Thunder Clap 6343, Revenge 6572, Sunder Armor
# 7386 (debuff 58567, also left by Devastate), Concussion Blow 12809, Last Stand 12975, Berserker Rage 18499 (also its
# aura), Devastate 20243, Spell Reflection 23920, Shield Slam 23922, Taunt 355, Demoralizing Shout 1160,
# Shockwave 46968, Enraged Regeneration 55694,
# Victory Rush 34428 (aura Victorious 32216), Heroic Leap 204400, Skull Banner 204405 (Rallied 204407).
# Talents: Shield Discipline 200062/200063 (buff 200064; absorb aura 200028).
# Concussion Blow, Last Stand, Devastate and Shockwave are talents that grant the spell of the
# same id.
strategy: warrior/prot
class: warrior
conditions:
  rage: value("rage::self target")
  tanking: value("my attacker count") >= 1
  shield: trigger("prot shield")
  # Shield Discipline learned (only the current rank is held, so either): the guide's Shield Slam line 2 starts at 50
  shield_learned: known(200062) or known(200063)
  disc_up: aura(self, 200064)
  # Sunder is not full: below 5 stacks of this bot's Sunder Armor, or 5 s or less left
  sunder_stale: stacks(target, "58567", own) < 5 or remaining(target, "58567", own) <= 5000
  ss_ready: known(23922) and cooldown(23922) == 0 and alive(target) and shield
  tc_ready: known(6343) and cooldown(6343) == 0 and alive(target)
  devastate_ok: known(20243) and alive(target) and shield
  vr_ready: known(34428) and aura(self, 32216) and alive(target)
  # Skull Banner: fewer than half of the group (within 40 yd) carry Rallied. There is no arithmetic, so this is a tier
  # table over the group size sz (r < sz / 2 <=> 2k-2 < sz <= 2k and r < k; the lower bound keeps a big tier from
  # matching a small group); one term per two members, up to a 40-player raid
  sz: value("party members below::101")
  rallied: value("party members with aura::101;1;0;204407")
  few_rallied: >-
    (sz <= 2 and rallied < 1) or (sz > 2 and sz <= 4 and rallied < 2) or (sz > 4 and sz <= 6 and rallied < 3)
    or (sz > 6 and sz <= 8 and rallied < 4) or (sz > 8 and sz <= 10 and rallied < 5)
    or (sz > 10 and sz <= 12 and rallied < 6) or (sz > 12 and sz <= 14 and rallied < 7)
    or (sz > 14 and sz <= 16 and rallied < 8) or (sz > 16 and sz <= 18 and rallied < 9)
    or (sz > 18 and sz <= 20 and rallied < 10) or (sz > 20 and sz <= 22 and rallied < 11)
    or (sz > 22 and sz <= 24 and rallied < 12) or (sz > 24 and sz <= 26 and rallied < 13)
    or (sz > 26 and sz <= 28 and rallied < 14) or (sz > 28 and sz <= 30 and rallied < 15)
    or (sz > 30 and sz <= 32 and rallied < 16) or (sz > 32 and sz <= 34 and rallied < 17)
    or (sz > 34 and sz <= 36 and rallied < 18) or (sz > 36 and sz <= 38 and rallied < 19)
    or (sz > 38 and sz <= 40 and rallied < 20)
rows:
  # L1: Victory Rush when usable and health is below 70%, above the rotation
  - do: victory rush
    when: vr_ready and health_pct(self) < 70
    relevance: normal + 9.6
  # L11: Victory Rush when its window has less than 5 s left (between Thunder Clap R5 and Concussion Blow, so the
  # Devastate filler cannot starve it)
  - do: victory rush
    when: vr_ready and remaining(self, 32216) < 5000
    relevance: normal + 8.35
  # R6: Shield Slam, any time it is ready (the free cast of Sword and Board lands here too), below Concussion Blow
  - do: prot shield slam
    when: ss_ready
    relevance: normal + 8.3
  # R1: Shield Slam first while Shield Discipline is learned and its buff is down
  - do: prot shield slam
    when: ss_ready and shield_learned and not disc_up
    relevance: normal + 8.8
  # R2: Thunder Clap with Shield Discipline up, or without a shield to slam
  - do: prot thunder clap
    when: tc_ready and (not shield or disc_up)
    relevance: normal + 8.7
  # R5: Thunder Clap without Shield Discipline up when the next Shield Slam is more than 1.5 s away, or when the target
  # lacks this bot's slow. Above Shockwave and Revenge (guide single target line 3 holds all three clauses)
  - do: prot thunder clap
    when: >-
      tc_ready and shield and not disc_up
      and (cooldown(23922) > 1500 or not aura(target, 6343, own))
    relevance: normal + 8.65
  # R3: Shockwave on cooldown with the target in front of the bot
  - do: prot shockwave
    when: >-
      known(46968) and cooldown(46968) == 0 and alive(target) and in_range(target, 10) and in_arc(target, 104)
    relevance: normal + 8.6
  # R4: Revenge whenever it is castable
  - do: prot revenge
    when: known(6572) and cooldown(6572) == 0 and alive(target) and trigger("revenge")
    relevance: normal + 8.5
  # R6b: Concussion Blow on cooldown against a boss, above the ready Shield Slam (R6)
  - do: prot concussion blow
    when: known(12809) and cooldown(12809) == 0 and alive(target) and (boss(target) or elite(target))
    relevance: normal + 8.4
  # R7: Devastate while Sunder is not full (guide single target line 8), above Heroic Strike
  - do: prot devastate
    when: devastate_ok and sunder_stale
    relevance: normal + 8.15
  # R8: Devastate, the filler that builds the Sunder stacks
  - do: prot devastate
    when: devastate_ok
    relevance: normal + 8
  # R8b: without a shield Devastate cannot be cast, so Sunder Armor keeps the debuff at 5 stacks and fresh
  - do: prot sunder armor
    when: >-
      known(7386) and alive(target) and not shield
      and (stacks(target, "58567", own) < 5 or remaining(target, "58567", own) < 6000)
    relevance: normal + 7.9

  # D1: Last Stand at low health after real damage (25% of maximum health in 5 s), above the rotation so a Thunder
  # Clap lands under the raised maximum health
  - do: prot last stand
    when: >-
      value("prot recent damage") >= 25 and known(12975) and cooldown(12975) == 0 and health_pct(self) < 40
    relevance: emergency + 3
  # D2: Shield Wall below 30% health or after 40% of maximum health taken in 5 s
  - do: prot shield wall
    when: >-
      (value("prot recent damage") >= 40 or health_pct(self) < 30) and known(871) and cooldown(871) == 0 and shield
    relevance: emergency + 2
  # D3 (PW2): Enraged Regeneration, once Shield Wall is gone
  - do: prot enraged regeneration
    when: >-
      known(55694) and cooldown(55694) == 0 and health_pct(self) < 35
      and (not known(871) or cooldown(871) > 0 or not shield)
    relevance: emergency + 1
  # D4: break a fear, sleep or sap with Berserker Rage (no stance swap: the spell has no stance requirement here)
  - do: berserker rage
    when: known(18499) and cooldown(18499) == 0 and trigger("fear sleep sap")
    relevance: emergency + 1

  # I1, I2: Shield Bash (works in Defensive Stance), on the current cast and on an enemy healer's
  - do: shield bash
    when: known(72) and cooldown(72) == 0 and shield and trigger("shield bash")
    relevance: interrupt
  - do: shield bash on enemy healer
    when: known(72) and cooldown(72) == 0 and shield and trigger("shield bash on enemy healer")
    relevance: interrupt

  # G1: taunt a mob that has turned on someone else (stock chain: Taunt, Heroic Throw, Shield Slam)
  - do: taunt
    trigger: lose aggro
    relevance: interrupt + 1
  # G2: Taunt a loose enemy that is hitting a party member
  - do: prot taunt
    when: known(355) and cooldown(355) == 0 and alive("prot loose enemy")
    relevance: interrupt + 1
  # G3: Spell Reflection the moment the current target casts a spell at the bot (off the GCD, no rage gate)
  - do: prot spell reflection
    when: known(23920) and cooldown(23920) == 0 and shield and trigger("spell reflection")
    relevance: interrupt - 1

  # F: Defensive Stance, the Prot stance
  - do: prot defensive stance
    when: known(71) and not aura(self, 71)
    relevance: high + 9
  # C1: Charge a target 8 to 25 yd away (it works in Defensive Stance and in combat). Above `reach
  # melee`, so the bot charges rather than walks; on cooldown, or in range, `reach melee` takes over
  - do: charge
    when: >-
      known(100) and cooldown(100) == 0 and alive(target) and in_range(target, 25)
      and not in_range(target, 8)
    relevance: high + 5
  # S1: Skull Banner (off the GCD) in the first 5 s of a boss fight, when fewer than half of the group have Rallied
  - do: prot skull banner
    when: >-
      known(204405) and cooldown(204405) == 0 and (boss(target) or elite(target))
      and combat_time() < 5000 and few_rallied
    relevance: high + 8.5
  # K1: Commanding Shout, kept from the stock tank
  - do: commanding shout
    trigger: commanding shout
    relevance: high + 8

  # C2: Heroic Leap (off the GCD) at the current target 8 to 40 yd away, only while Charge is on cooldown
  - do: heroic leap
    when: >-
      known(204400) and cooldown(204400) == 0 and known(100) and cooldown(100) > 0 and alive(target)
      and in_range(target, 40) and not in_range(target, 8)
    relevance: high + 4.5
  # C3: Heroic Leap at a loose enemy 8 to 40 yd away, only while Charge is on cooldown (the action picks the landing
  # point)
  - do: heroic leap loose
    when: >-
      known(204400) and cooldown(204400) == 0 and known(100) and cooldown(100) > 0 and alive("prot loose enemy")
      and in_range("prot loose enemy", 40) and not in_range("prot loose enemy", 8)
    relevance: high + 4.4
  # B1: Shield Block on cooldown while something is hitting the bot
  - do: prot shield block
    when: known(2565) and cooldown(2565) == 0 and shield and tanking
    relevance: high + 7.6
  # B3 (PW6): Bloodrage on cooldown while rage is low (it costs health)
  - do: prot bloodrage
    when: known(2687) and cooldown(2687) == 0 and rage < 70 and health_pct(self) > 50
    relevance: high + 7.2
  # H1: Heroic Strike (instant GCD strike) at 60 rage or more on one or two targets (three or more: Cleave in prot-aoe)
  - do: prot heroic strike
    when: known(78) and alive(target) and rage >= 60 and enemies_within(8) < 3
    relevance: normal + 8.1

  # M1: walk to a target out of melee range
  - do: reach melee
    trigger: enemy out of melee
    relevance: high + 1
