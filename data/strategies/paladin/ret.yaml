# Retribution paladin rows, appended to the "dps" combat strategy by PaladinReworkRetStrategy::InitTriggers.
# Each row queues its actions at the relevance when its condition holds (`when`, the expression language of
# StrategyExpression.h) or when an existing C++ trigger fires (`trigger`). Execution order is by relevance, not by
# position in this file.
# AoE rows are gated on `unsafe aoe units` (X11).
strategy: paladin/ret
class: paladin
conditions:
  # Mode gates: Single and Pack rows need a live current target, and 3+ enemies within 8 yd of the bot is a pack
  single: alive(target) and enemies_within(8) < 3
  pack: alive(target) and enemies_within(8) >= 3

  # Primed seal (any of the six, cast by the bot)
  primed: aura(self, "201063,201064,201065,201066,201067,201068", own)
  primed_justice: aura(self, 201066, own)
  deliverance_known: known(201061)
  # Primed Command needs 2 enemies within 8 yd of the target to count as a pack, any other primed seal 3
  primed_pack: >-
    (aura(self, 201064, own) and enemies_near_target(8) >= 2)
    or (not aura(self, 201064, own) and enemies_near_target(8) >= 3)

  # Seal stacks (the owned seal; 0 with none): Avenging Wrath and Execution Sentence hold at 3+, Wake of Ashes at 8+
  seal_burst_ok: stacks(self, "21084,20165,20166,20164,20375,31801", own) <= 2
  seal_wake_ok: stacks(self, "21084,20165,20166,20164,20375,31801", own) <= 7

  art_of_war: aura(self, 59578, own)
  forbearance: aura(self, "25771,61988")

  # X11 gates. Around the bot: Wake of Ashes (12 yd cone), Holy Wrath (10), Divine Storm and Consecration (8). Around
  # the target: Deliverance (8), the Execution Sentence burst (5). Execution Sentence on cluster: 5 at the cluster.
  safe_self_12: value("unsafe aoe units::12;self") == 0
  safe_self_10: value("unsafe aoe units::10;self") == 0
  safe_self_8: value("unsafe aoe units::8;self") == 0
  safe_target_8: value("unsafe aoe units::8") == 0
  safe_target_5: value("unsafe aoe units::5") == 0
  safe_cluster_5: value("unsafe aoe units::5;cluster") == 0

rows:
  # Kept from the stock DpsPaladinStrategy / GenericPaladinStrategy. CombatStrategy only closes to spell
  # range, so without "reach melee" the bot would stand at range and never melee.
  - do: reach melee
    trigger: enemy out of melee
    relevance: high + 1
  - do: hammer of justice
    trigger: hammer of justice interrupt
    relevance: interrupt
  - do: hammer of justice on enemy healer
    trigger: hammer of justice on enemy healer
    relevance: interrupt
  - do: hammer of justice on snare target
    trigger: hammer of justice on snare target
    relevance: interrupt
  - do: hand of freedom on party
    trigger: hand of freedom on party
    relevance: high + 4

  # Any mode
  - do: paladin cast seal
    trigger: paladin no seal
    relevance: normal + 7.0
  - do: divine plea
    when: value("has mana::self target") and mana(self) < 70
    relevance: normal + 7.5
  - do: divine shield
    when: health(self) < 15 and not forbearance
    relevance: emergency + 6
  - do: lay on hands
    when: health(self) < 10 and (forbearance or not known(642) or cooldown(642) > 0)
    relevance: emergency + 5
  - do: divine protection
    when: health(self) < 35 and value("my attacker count") >= 1
    relevance: emergency + 4

  # Single target
  - do: judgement
    when: single and primed_justice and not boss(target) and controlled(target)
    relevance: normal + 6.8
  - do: hammer of justice
    when: >-
      single and primed_justice and not boss(target) and not controlled(target) and known(853) and
      cooldown(853) == 0
    relevance: normal + 6.7
  - do: judgement
    when: single and primed and (not primed_pack or not deliverance_known)
    relevance: normal + 6.5
  - do: deliverance
    when: single and primed and primed_pack and deliverance_known and safe_target_8
    relevance: normal + 6.5
  - do: avenging wrath
    when: >-
      single and elite(target) and health_pct(target) > 30 and seal_burst_ok and (aura(self, 201103, own)
      or not known(20165) or cooldown(20165) > 20000)
    relevance: normal + 6.0
  - do: execution sentence
    when: >-
      single and seal_burst_ok and ((boss(target) and health_pct(target) > 25) or (not boss(target) and
      health_pct(target) > 50)) and safe_target_5
    relevance: normal + 5.5
  - do: wake of ashes
    when: single and in_range(target, 12) and in_arc(target, 104) and seal_wake_ok and safe_self_12
    relevance: normal + 5.0
  - do: hammer of wrath
    when: single and health_pct(target) <= 20
    relevance: normal + 4.5
  - do: flash of light
    when: single and art_of_war and health(self) < 40 and not value("party has healer")
    relevance: normal + 4.25
  - do: exorcism
    when: single and known("exorcism") and cooldown("exorcism") == 0 and (art_of_war or not moving(self))
    relevance: normal + 4.0
  - do: blade of justice
    when: single and in_range(target, 20)
    relevance: normal + 3.5
  - do: crusader strike
    when: >-
      single and (stacks(self, "201426,201427,201428", own) < 3 or remaining(self, "201426,201427,201428",
      own) < 2000)
    relevance: normal + 3.0
  - do: divine storm
    when: single and in_range(target, 8) and safe_self_8
    relevance: normal + 2.5
  - do: holy wrath
    when: single and in_range(target, 10) and safe_self_10
    relevance: normal + 2.0
  - do: crusader strike
    when: single
    relevance: normal + 1.5
  - do: consecration
    when: single and mana(self) > 60 and safe_self_8
    relevance: normal + 1.0

  # Pack
  - do: deliverance
    when: pack and primed and deliverance_known and safe_target_8
    relevance: normal + 6.5
  - do: judgement
    when: pack and primed and not deliverance_known
    relevance: normal + 6.5
  - do: avenging wrath
    when: pack and value("elite enemies within::8") >= 4
    relevance: normal + 6.25
  - do: wake of ashes
    when: pack and enemies_in_cone(12, 104) >= 2 and seal_wake_ok and safe_self_12
    relevance: normal + 6.0
  - do: holy wrath
    when: pack and enemies_within(10) >= 2 and safe_self_10
    relevance: normal + 5.5
  - do: divine storm
    when: pack and enemies_within(8) >= 2 and safe_self_8
    relevance: normal + 5.0
  - do: consecration
    when: pack and enemies_within(8) >= 3 and mana(self) > 30 and safe_self_8
    relevance: normal + 4.5
  - do: execution sentence on cluster
    when: pack and health_pct("most clustered enemy::5") > 50 and safe_cluster_5
    relevance: normal + 4.0
  - do: blade of justice
    when: pack and aura(self, 20375, own) and enemies_near_target(8) >= 3
    relevance: normal + 3.5
  - do: exorcism
    when: pack and art_of_war
    relevance: normal + 3.0
  - do: hammer of wrath
    when: pack and health_pct(target) <= 20
    relevance: normal + 2.5
  - do: crusader strike
    when: pack
    relevance: normal + 2.0
