# Retribution paladin rows, appended to the "dps" combat strategy by PaladinReworkRetStrategy::InitTriggers.
# Each row: a C++ trigger (do not rename without changing PaladinAiObjectContext.cpp) queues the actions at the
# relevance. Execution order is by relevance, not by position in this file.
strategy: paladin/ret
class: paladin
rows:
  # Kept from the stock DpsPaladinStrategy / GenericPaladinStrategy. CombatStrategy only closes to spell
  # range, so without "reach melee" the bot would stand at range and never melee.
  - do: reach melee
    trigger: enemy out of melee
    relevance: high + 1
  - do: hammer of justice
    trigger: hammer of justice interrupt
    relevance: interrupt
  - do: hammer of justice on enemy healer
    trigger: hammer of justice on enemy healer
    relevance: interrupt
  - do: hammer of justice on snare target
    trigger: hammer of justice on snare target
    relevance: interrupt
  - do: hand of freedom on party
    trigger: hand of freedom on party
    relevance: high + 4

  # Any mode
  - do: paladin cast seal
    trigger: paladin no seal
    relevance: normal + 7.0
  - do: divine plea
    trigger: ret divine plea
    relevance: normal + 7.5
  - do: divine shield
    trigger: ret divine shield
    relevance: emergency + 6
  - do: lay on hands
    trigger: ret lay on hands
    relevance: emergency + 5
  - do: divine protection
    trigger: ret divine protection
    relevance: emergency + 4

  # Single target
  - do: judgement
    trigger: ret justice combo
    relevance: normal + 6.8
  - do: hammer of justice
    trigger: ret justice setup
    relevance: normal + 6.7
  - do: judgement
    trigger: ret judgement
    relevance: normal + 6.5
  - do: deliverance
    trigger: ret deliverance
    relevance: normal + 6.5
  - do: avenging wrath
    trigger: ret avenging wrath
    relevance: normal + 6.0
  - do: execution sentence
    trigger: ret execution sentence
    relevance: normal + 5.5
  - do: wake of ashes
    trigger: ret wake of ashes
    relevance: normal + 5.0
  - do: hammer of wrath
    trigger: ret hammer of wrath
    relevance: normal + 4.5
  - do: flash of light
    trigger: ret art of war heal
    relevance: normal + 4.25
  - do: exorcism
    trigger: ret exorcism
    relevance: normal + 4.0
  - do: blade of justice
    trigger: ret blade of justice
    relevance: normal + 3.5
  - do: crusader strike
    trigger: ret swift retribution
    relevance: normal + 3.0
  - do: divine storm
    trigger: ret divine storm
    relevance: normal + 2.5
  - do: holy wrath
    trigger: ret holy wrath
    relevance: normal + 2.0
  - do: crusader strike
    trigger: ret single target
    relevance: normal + 1.5
  - do: consecration
    trigger: ret consecration
    relevance: normal + 1.0

  # Pack
  - do: deliverance
    trigger: ret pack deliverance
    relevance: normal + 6.5
  - do: judgement
    trigger: ret pack judgement
    relevance: normal + 6.5
  - do: avenging wrath
    trigger: ret pack avenging wrath
    relevance: normal + 6.25
  - do: wake of ashes
    trigger: ret pack wake of ashes
    relevance: normal + 6.0
  - do: holy wrath
    trigger: ret pack holy wrath
    relevance: normal + 5.5
  - do: divine storm
    trigger: ret pack divine storm
    relevance: normal + 5.0
  - do: consecration
    trigger: ret pack consecration
    relevance: normal + 4.5
  - do: execution sentence on cluster
    trigger: ret pack execution sentence
    relevance: normal + 4.0
  - do: blade of justice
    trigger: ret pack blade of justice
    relevance: normal + 3.5
  - do: exorcism
    trigger: ret pack exorcism
    relevance: normal + 3.0
  - do: hammer of wrath
    trigger: ret pack hammer of wrath
    relevance: normal + 2.5
  - do: crusader strike
    trigger: ret pack crusader strike
    relevance: normal + 2.0
