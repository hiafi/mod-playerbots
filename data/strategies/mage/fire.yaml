# Fire mage rows, appended to the "fire" and "frostfire" combat strategies by MageReworkFireStrategy::InitTriggers.
# Each row queues its actions at the relevance when its condition holds (`when`, the expression language of
# StrategyExpression.h) or when an existing C++ trigger fires (`trigger`). Execution order is by relevance, not by
# position in this file. The three rows that stay C++ share state with their actions or keep a clock of their own:
# Flashpoint (combat-time and target-age clocks), Mana Gem (bag scan) and Evocation (EvocationAllowed is also the
# action's re-check).
# AoE rows are gated on `unsafe aoe units` (X11); the Flashpoint and Living Bomb on attacker rows are not (see the
# notes at those rows).
strategy: mage/fire
class: mage
conditions:
  # Mode gates. Single and Pack rows need a live current target; the pack is 3+ enemies within 10 yd of the target
  # (the current target counts itself). Target rows apply in both modes.
  target_alive: alive(target)
  single: alive(target) and enemies_near_target(10) < 3
  pack: alive(target) and enemies_near_target(10) >= 3
  # X11 gates: Living Bomb's explosion (10 yd) and a single-mode Meteor (8 yd) burst around the target; a pack Meteor,
  # Flamestrike (5 yd) and Blizzard (8 yd) land on the most clustered enemy; Dragon's Breath (10 yd) is a cone from
  # the bot
  safe_target_10: value("unsafe aoe units::10") == 0
  safe_target_8: value("unsafe aoe units::8") == 0
  safe_cluster_8: value("unsafe aoe units::8;cluster") == 0
  safe_cluster_5: value("unsafe aoe units::5;cluster") == 0
  safe_self_10: value("unsafe aoe units::10;self") == 0

  hot_streak: aura(self, 48108)
  # The core's streak state (Stage HU): the first Hot Streak starter crit leaves this for 10 s, the next converts it
  heating_up: aura(self, 200044)
  fanned_flames: aura(self, 200118)
  meteor_ready: known(200095) and cooldown(200095) == 0
  # Fewer than 3 own Living Bombs out ("attackers with aura id": own 44457, 35 yd)
  bomb_cap_open: value("attackers with aura id::44457;1;35") < 3

rows:
  # Mana, either mode: the gem first, then Evocation
  - do: use mana agate
    trigger: fire mana gem
    relevance: emergency - 1
  - do: fire evocation
    trigger: fire evocation
    relevance: emergency - 2

  # Brilliance Aura: a party member under 40% mana, or the bot under 50%. Same row as Arcane's without BURN.
  - do: arcane brilliance aura
    when: >-
      target_alive and known(200067) and cooldown(200067) == 0 and not aura(self, 200067)
      and (value("party members below mana::40") >= 1 or mana(self) < 50)
    relevance: normal + 9.5

  # Single target
  - do: pyroblast
    when: single and hot_streak
    relevance: normal + 8.0
  - do: scorch
    when: single and fanned_flames
    relevance: normal + 7.5
  # Both modes, capped at 3 bombs in a pack. Never refreshed, or the explosion is lost.
  - do: fire living bomb
    when: >-
      target_alive and not aura(target, 44457, own) and (enemies_near_target(10) < 3 or bomb_cap_open)
      and safe_target_10
    relevance: normal + 7.0
  - do: fire flashpoint
    trigger: fire flashpoint
    relevance: normal + 3.0
  - do: mage meteor
    when: single and meteor_ready and safe_target_8
    relevance: normal + 2.0

  # Pack, ranked above the single list. The bomb on another attacker has no gate: its explosion is centred on a unit
  # that no `unsafe aoe units` form can name.
  - do: fire living bomb on attacker
    when: pack and bomb_cap_open and exists("attacker without aura id::44457;1;0;0;35")
    relevance: normal + 9.5
  - do: pyroblast
    when: pack and hot_streak
    relevance: normal + 9.0
  - do: mage dragon's breath
    when: pack and known(31661) and cooldown(31661) == 0 and safe_self_10
    relevance: normal + 8.5
  - do: mage meteor
    when: pack and meteor_ready and safe_cluster_8
    relevance: normal + 8.0
  - do: fire pack flashpoint
    trigger: fire pack flashpoint
    relevance: normal + 7.5
  - do: scorch
    when: pack and fanned_flames
    relevance: normal + 7.0
  - do: mage flamestrike
    when: >-
      pack and known(2120) and not dynobj(2120) and value("most clustered enemy count::5") >= 4
      and safe_cluster_5
    relevance: normal + 6.5
  - do: mage blizzard
    when: >-
      pack and known(10) and dynobj(2120) and value("most clustered enemy count::8") >= 4 and safe_cluster_8
    relevance: normal + 6.0

  # Either mode, below the pack rows: the single-list rows the pack block doesn't list
  # Improved Scorch (any caster) absent or about to expire, for a bot with the talent
  - do: scorch
    when: >-
      target_alive and (known(11095) or known(12872) or known(12873)) and remaining(target, 22959) < 3000
    relevance: normal + 4.0
  # Amplify Magic lines up with Combustion (both 10 s on a 2 min cooldown): just above it so it goes out first, and
  # still fires if Combustion went first.
  - do: arcane amplify magic
    when: >-
      target_alive and known(1008) and cooldown(1008) == 0 and not aura(target, 1008) and lifetime(target) >= 10
      and known(11129) and (cooldown(11129) == 0 or aura(self, 11129))
    relevance: normal + 3.6
  - do: combustion
    when: target_alive and known(11129) and cooldown(11129) == 0 and lifetime(target) >= 10
    relevance: normal + 3.5
  # Heating Up is up and Hot Streak is not: Fire Blast always crits, so it completes the streak
  - do: fire crit streak fire blast
    when: target_alive and known(2136) and cooldown(2136) == 0 and heating_up and not hot_streak
    relevance: normal + 2.5

  # The last row
  - do: fireball
    when: target_alive
    relevance: normal + 1.0
