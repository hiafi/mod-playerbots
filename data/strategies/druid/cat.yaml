# The reworked Cat druid's rotation and its offheal overlay, one document each: "druid/cat" is appended to the "cat"
# (and "dps") combat strategy by DruidReworkCatStrategy::InitTriggers, "druid/cat-offheal" to the optional "offheal"
# strategy by DruidReworkCatOffhealStrategy::InitTriggers. Each row queues its action at the relevance when its
# condition holds (`when`, the expression language of StrategyExpression.h) or when an existing C++ trigger fires
# (`trigger`). Execution order is by relevance, not by position in this file. Actions named "cat ..." and "druid ..."
# are RowCheckedAction (they re-check their own row before casting); the stock actions (dash, reach melee, reach party
# member to heal) are kept from the stock strategy. Rows that can fire together never share an action name and
# qualifier (they would merge into one basket and only the first row would be re-checked): Mangle's debuff row and its
# builder row, and Rip and Ferocious Bite, have their own names. The `do:` qualifier and the unit qualifier in `when:`
# are the same literal ("cat offheal regrowth::40,40"): otherwise the action targets another unit than the one checked.
# Every spell a bot may not know yet carries `known()`: `cooldown()` of an unknown spell reads 0.
# Combo points, energy and position are plain values: `value("combo::current target")` (0 unless the combo target is the
# current target), `value("energy::self target")` (absolute energy) and `value("behind::current target")`.
# AoE round 1 (2026-11-15, user ruling: "put dots on everything", then Swipe (Cat) moved from level 71 to 38): the pack
# list is two rows. `cat pack rake`: Rake on every other engaged enemy within melee reach. `cat swipe`: Swipe (Cat) on
# the target while 2 or more enemies are around it, in place of Shred and Mangle (AoE round 2, 2026-11-15, user ruling:
# Swipe awards 1 combo point on the target, so it is the pack builder). Rip, Ferocious Bite and the Mangle
# debuff stay on the current target: combo points are spent per target. The bot casts the pack Rake on the unit
# "attacker without aura id" picks; PlayerbotAI::CastSpell selects that unit for the cast and restores the selection
# afterwards, and the druid's combo points follow the selection (ComboPointMechanics.cpp), so the point a secondary
# Rake awards ends on the current target. Swipe (Cat) awards its point on the target only.
# AoE round 3 (2026-11-16, user ruling: Primal Wrath baseline, "We need an AoE finisher for them to feel complete"): the
# pack finisher. `cat primal wrath` at 5 combo points with 3 or more enemies around the target puts a Rip-shaped bleed
# (1.3x Rip's tick) on every enemy within 8 yd of the bot, above Rip and Ferocious Bite while it holds. Rip stays the
# single-target finisher: below 3 enemies Primal Wrath never fires, and while the target's own bleed is due Rip goes on
# the target first. Rip and Primal Wrath are one bleed per druid (spell_group 1306, the newest replaces the other), so
# every "the target's Rip" check reads both ids ("1079,200472"); at one target only 1079 is ever there.
# AoE round 3 follow-up (2026-11-16, user ruling: "For feral, we should also let it use Thrash"): `cat thrash`, Thrash
# (Cat) 200474 (hit + bleed on every enemy within 8 yd, 50 energy, 6 s cooldown, 1 combo point on the target) at 3 or
# more enemies around the target, above the secondary Rakes and Swipe; while it is ready the pack builders below it
# stand down so the energy pools for it. Below 3 enemies it never fires, so single target is unchanged.
# Spell ids: Cat Form 768, Swipe (Cat) 62078, Predator's Swiftness 69369, Barkskin 22812, Feral Charge - Cat 49376,
# Ravage 6785 (its free cast is the Stampede buff 200434), Berserk 50334, Tiger's Fury 5217, Rip 1079, Primal Wrath
# 200472, Thrash (Cat) 200474, Rake 1822,
# Ferocious Bite 22568, Mangle (Cat) 33876 (the debuff on the target is the spell itself, 33878 is the Bear's; 46856
# and 46857 are Trauma), Skull Bash 200605.
strategy: druid/cat
class: druid
conditions:
  in_cat: aura(self, 768)
  cp: value("combo::current target")
  energy: value("energy::self target")
  behind: value("behind::current target")
  # Mangle (Cat) and (Bear) or the Trauma debuffs, from any caster
  mangled: aura(target, "33876,33878,46856,46857")
  # the Mangle debuff is wanted / Rake is wanted; known() keeps a low-level bot from waiting on a spell it lacks
  mangle_due: known(33876) and not mangled
  rake_due: known(1822) and remaining(target, 1822, own) < 3000
  # Rake on every other enemy (AoE round 1): the aoe toggle on, the primary target's Mangle debuff and Rake settled
  # (a secondary Rake never takes the energy of those rows), and a builder only while the combo points have room
  # (cp < 5, like the other builders: the Rake's point would be wasted at five). The Rake is the cheapest builder, so
  # an energy-starved Rake never lets Shred or Mangle starve it.
  pack_rake: >-
    value("cat aoe enabled") and known(1822) and alive(target) and cp < 5 and not mangle_due and not rake_due
  # Swipe (Cat) in a pack (AoE round 1, builder since round 2): the aoe toggle on, the target's Mangle debuff and Rake
  # settled (the upkeep rows and the secondary Rakes go first), 2 or more enemies around the target (the target counts
  # itself; Swipe chains to the enemies within 10 yd), no unpulled enemy in that blast, and a builder only while the
  # combo points have room (`cp < 5`, like Shred). The Shred and Mangle builder rows carry `not pack_swipe`, so in a
  # pack the energy pools for Swipe (40 energy against Shred's 25)
  pack_swipe: >-
    value("cat aoe enabled") and known(62078) and alive(target) and cp < 5 and enemies_near_target(10) >= 2
    and value("unsafe aoe units::10") == 0 and not mangle_due and not rake_due
  # Thrash (Cat) in a pack (AoE round 3 follow-up): the aoe toggle on, ready (6 s cooldown), a builder only while the
  # combo points have room, 3 or more enemies around the target (the target counts itself; the hit reaches 8 yd from
  # the bot), no unpulled enemy in that blast, the target's Mangle debuff and Rake settled. 3, not 2: per energy a
  # Thrash (~1,370 per enemy for 50) beats a secondary Rake (~2,145 for 30) only from 3 enemies (82 against 71 per
  # energy; 55 at 2). While it holds, the secondary Rake, Swipe, Shred and Mangle rows stand down, so the energy pools
  # for it (at most 5 s at 10 energy a second, inside its 6 s cooldown); the upkeep rows and finishers stay above it
  pack_thrash: >-
    value("cat aoe enabled") and known(200474) and cooldown(200474) == 0 and alive(target) and cp < 5
    and enemies_near_target(8) >= 3 and value("unsafe aoe units::8") == 0 and not mangle_due and not rake_due
  berserking: aura(self, 50334)
  # the target's own bleed (Rip or Primal Wrath, one bleed per druid) is missing or under 2 s
  rip_due: remaining(target, "1079,200472", own) < 2000
  # Primal Wrath in a pack (AoE round 3; follow-up 2 refresh window): the pack gate below, 5 combo points, the
  # target's own bleed not due (Rip takes it then), and a bleed to refresh: the target's bleed under 4 s, or an engaged
  # enemy other than the target within 8 yd that lacks the bot's bleed or has under 4 s of it and should live 4 s more
  # (two ticks). 4 s, not 2 (follow-up 2): combo points, not the bleed, limit Primal Wrath (3 casts a minute against
  # the 5 a 12 s bleed needs), so refreshing two ticks early costs little and keeps the pack bleeding between casts;
  # a later refresh lets ticks lapse while the points wait for energy
  pack_wrath: >-
    pack_finish and alive(target) and cp >= 5 and not rip_due
    and (remaining(target, "1079,200472", own) < 4000
         or alive("attacker without aura id::200472,1079;1;4000;4;8;notarget"))
  # The Primal Wrath pack gate (AoE round 3 follow-up 2, 2026-11-16): the aoe toggle on, Primal Wrath known, 3 or more
  # enemies around the target, no unpulled enemy in the blast. Ferocious Bite stands down only while Primal Wrath has a
  # bleed to refresh (`not pack_wrath`), not for the whole pack: with Bite off in packs (Bite standing down on
  # `pack_finish`) the bot either refreshed live bleeds early or sat at 5 points with energy capping, 5 targets 2,220
  # and 3 targets 1,560 against 2,471 / 1,669 for this rule (FeralCatSim, 60 s x 5, 2026-11-16)
  pack_finish: >-
    value("cat aoe enabled") and known(200472) and enemies_near_target(8) >= 3 and value("unsafe aoe units::8") == 0
  # Skull Bash 200605 is ready and the bot is in Cat Form
  skull_bash_ok: known(200605) and cooldown(200605) == 0 and in_cat
rows:
  # F: Cat Form (also back into it after leaving form, e.g. the out-of-combat heals)
  - do: cat cat form
    when: known(768) and not in_cat
    relevance: high

  # E1: Regrowth from Cat Form on Predator's Swiftness (instant) when hurt (DR31)
  - do: cat regrowth
    when: aura(self, 69369, own) and health_pct(self) < 50
    relevance: emergency + 3

  # E2: Barkskin when low
  - do: druid barkskin
    when: known(22812) and cooldown(22812) == 0 and health_pct(self) < 35
    relevance: emergency + 1

  # BG: Dash with the flag, or after an enemy flag carrier
  - do: dash
    trigger: player has flag
    relevance: emergency + 2
  - do: dash
    trigger: enemy flagcarrier near
    relevance: emergency + 2

  # M1: walk to a target out of melee range
  - do: reach melee
    trigger: enemy out of melee
    relevance: high + 1

  # M2: Cower to shed threat (DR16)
  - do: cat cower
    trigger: medium threat
    relevance: high + 0.9

  # U1 (dungeon-prereqs S5): Skull Bash the casting target, then a casting enemy healer within reach
  - do: cat skull bash
    when: skull_bash_ok and in_range(target, 5) and trigger("skull bash")
    relevance: interrupt + 2
  - do: cat skull bash on enemy healer
    when: >-
      skull_bash_ok and in_range("enemy healer target::skull bash", 5) and trigger("skull bash on enemy healer")
    relevance: interrupt + 1

  # O1: Feral Charge from 8 to 25 yd (DR30)
  - do: cat feral charge
    when: >-
      known(49376) and cooldown(49376) == 0 and in_cat and alive(target) and in_range(target, 25)
      and not in_range(target, 8)
    relevance: high + 9

  # O2: Ravage on the Stampede the charge grants
  - do: cat ravage
    when: known(6785) and alive(target) and aura(self, 200434, own)
    relevance: normal + 9.9

  # G1: Berserk once Rip (or Primal Wrath's bleed) and Rake are both up
  - do: cat berserk
    when: >-
      known(50334) and cooldown(50334) == 0 and alive(target) and aura(target, "1079,200472", own)
      and aura(target, 1822, own)
    relevance: normal + 9.8

  # G2: Tiger's Fury under 40 energy, never inside Berserk (DR28)
  - do: cat tigers fury
    when: known(5217) and cooldown(5217) == 0 and alive(target) and energy < 40 and not berserking
    relevance: normal + 9.7

  # 1: the Mangle debuff, while no combo-point cap is in the way
  - do: cat mangle debuff
    when: alive(target) and mangle_due and cp < 5
    relevance: normal + 9.0

  # 2a (AoE round 3): Primal Wrath, the pack finisher, above Rip and Ferocious Bite. It never fires while the target's
  # own bleed is due (`not rip_due`), so Rip keeps the target and Primal Wrath spreads the bleed to the rest of the
  # pack; it replaces the target's Rip with its own (stronger) bleed. 50 energy (41 with Predatory Strikes): an
  # energy-starved Primal Wrath waits, and `cp < 5` keeps every builder from spending the energy meanwhile
  - do: cat primal wrath
    when: pack_wrath
    relevance: normal + 8.6
  # 2, 3: five combo points go into Rip, or into Ferocious Bite while the target's bleed has 2 s or more left and
  # (follow-up 2) no bleed in the pack is inside Primal Wrath's 4 s refresh window
  - do: cat rip
    when: known(1079) and alive(target) and cp >= 5 and rip_due
    relevance: normal + 8.5
  - do: cat ferocious bite
    when: known(22568) and alive(target) and cp >= 5 and not rip_due and not pack_wrath
    relevance: normal + 8.0

  # 4, 5, 6: the builders. `cp < 5` stops a builder from wasting a point while a finisher waits for energy: an
  # energy-starved finisher fails to cast, and the engine would otherwise run the next basket, a builder. For the
  # same reason a lower builder waits while a higher one is due but not yet affordable (Shred is the cheapest, so
  # it would otherwise starve Rake and the Mangle debuff of energy): a due Mangle debuff is row 1, and row 6 is the
  # same spell
  - do: cat rake
    when: alive(target) and cp < 5 and rake_due and not mangle_due
    relevance: normal + 7.5
  # 4b (AoE round 1): Rake on an engaged enemy other than the target that lacks the bot's Rake or has under 3 s of it
  # left, within 3 yd of the bot (edge to edge; at 5 the pick was often an enemy the cast could not reach, the cast
  # failed and the same enemy was picked again, so nearest first and 3 yd), expected to live 6 s (two ticks of the 9 s
  # bleed), not stunned or otherwise controlled.
  # Between the primary target's Rake (7.5) and Shred (7.0). The `do:` qualifier and the unit qualifier in `when:` are
  # the same literal
  # 4a (AoE round 3 follow-up): Thrash (Cat), between the target's Rake (7.5) and the secondary Rakes (7.25); the
  # rows below it carry `not pack_thrash`
  - do: cat thrash
    when: pack_thrash
    relevance: normal + 7.4
  - do: cat pack rake::1822;1;3000;6;3;nearest,notarget,free
    when: >-
      pack_rake and not pack_thrash and alive("attacker without aura id::1822;1;3000;6;3;nearest,notarget,free")
    relevance: normal + 7.25
  # 4c (AoE round 2): Swipe (Cat), the pack builder (1 combo point on the target), above Shred and Mangle, which stand
  # down while it holds. The finisher rows above it (Rip 30, Ferocious Bite 35 energy) cost less than its 40 (50 less
  # Ferocity), so an energy-starved finisher is never starved by it
  - do: cat swipe
    when: pack_swipe and not pack_thrash
    relevance: normal + 7.1
  - do: cat shred
    when: >-
      alive(target) and cp < 5 and behind and not mangle_due and not rake_due and not pack_swipe and not pack_thrash
    relevance: normal + 7.0
  - do: cat mangle
    when: alive(target) and cp < 5 and not behind and not rake_due and not pack_swipe and not pack_thrash
    relevance: normal + 6.5
---
# `co +offheal`: heals from Cat Form (DR13, DQ2)
strategy: druid/cat-offheal
class: druid
rows:
  - do: reach party member to heal
    trigger: party member to heal out of spell range
    relevance: emergency + 3

  # Regrowth in form on the tank-first heal target; instant with Predator's Swiftness, else only while standing
  - do: cat offheal regrowth::40,40
    when: >-
      alive("tank first heal target::40,40") and health_pct("tank first heal target::40,40") < 40
      and (not moving(self) or aura(self, 69369, own))
    relevance: high + 6
