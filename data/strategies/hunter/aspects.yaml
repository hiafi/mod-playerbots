# Aspect rows of the reworked hunter, read by HunterReworkAspectStrategy ("bdps", in both engines) by the bot's spec:
# one document per spec. Aspects are off the global cooldown and share a 1 s category. Auras are checked by id (an
# aspect's name is shared with hidden auras: Aspect of the Beast's marker 201875, Viper's poison 201602). Aspect auras
# on the bot: 13165 Hawk, 13161 Beast, 34074 Viper.
strategy: hunter/aspect-bm
class: hunter
conditions:
  # Viper is kept from below 10% mana until mana is back above 50% (hysteresis), then the damage aspect returns
  free_to_swap: not aura(self, 34074) or mana(self) > 50
rows:
  - do: hunter aspect of the viper
    when: known(34074) and mana(self) < 10 and not aura(self, 34074)
    relevance: high + 9
  # Aspect of the Beast from level 20, Aspect of the Hawk before it
  - do: hunter aspect of the beast
    when: known(13161) and not aura(self, 13161) and free_to_swap
    relevance: high
  - do: hunter aspect of the hawk
    when: known(13165) and not known(13161) and not aura(self, 13165) and free_to_swap
    relevance: high
---
# Marksmanship: Aspect of the Hawk (20% on a ranged crit for Quick Shots) all the time; Viper has no damage penalty,
# so it is a mana engine only: from below 15% mana until mana is back above 60%, then Hawk returns.
strategy: hunter/aspect-mm
class: hunter
conditions:
  free_to_swap: not aura(self, 34074) or mana(self) > 60
rows:
  - do: hunter aspect of the viper
    when: known(34074) and mana(self) < 15 and not aura(self, 34074)
    relevance: high + 9
  - do: hunter aspect of the hawk
    when: known(13165) and not aura(self, 13165) and free_to_swap
    relevance: high
---
# Survival: Aspect of the Dragonhawk all the time (the Aspect of the Hawk before it is learned at 16); Viper has no
# damage penalty, so it is a mana engine only: from below 15% mana until mana is back above 60%, then the damage aspect
# returns. Auras by id: 61846 Dragonhawk (its explosion spell 201601 is a direct Fire hit, not an aura on the bot).
strategy: hunter/aspect-sv
class: hunter
conditions:
  free_to_swap: not aura(self, 34074) or mana(self) > 60
rows:
  - do: hunter aspect of the viper
    when: known(34074) and mana(self) < 15 and not aura(self, 34074)
    relevance: high + 9
  - do: hunter aspect of the dragonhawk
    when: known(61846) and not aura(self, 61846) and free_to_swap
    relevance: high
  - do: hunter aspect of the hawk
    when: not known(61846) and known(13165) and not aura(self, 13165) and free_to_swap
    relevance: high
